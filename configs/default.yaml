# AcousticWise default config. Values follow the technical design
# (docs/technical-design.md).

seed: 42

data:
  bundle_dir: data/uniqueship        # unzipped UniqueShip bundle (only needed to build the cache)
  cache_dir: data/cache              # downloaded feature caches: sr32000/, sr16000/
  splits_path: artifacts/splits.json
  app_fold: 1                        # the fold whose model ships in the app
  runs_dir: artifacts/runs           # one folder per trained model

audio:
  sample_rate: 32000                 # native rate; Nyquist 16 kHz (ticket 03)
  window_seconds: 5.0
  hop_seconds: 2.5                   # for uploads longer than one window
  min_seconds: 4.0                   # shorter clips raise AudioTooShortError; 4.0 s and up are zero-padded
  normalization: rms                 # peak | rms | none; rms ties none on validation and ignores recording level (docs/results.md)

features:
  n_fft: 2048
  hop_length: 512
  n_mels: 64                         # 64 x 313 frames per 5 s window
  n_mfcc: 20                         # MFCC derived from the log-mel; mean/std summary = 40 values
  cache_format: 1                    # bump by hand when feature code changes

validation:                          # set from the dataset report (docs/dataset-report.md)
  max_file_mb: 200                   # Streamlit's default upload cap
  max_seconds: 300                   # 5 minutes = 60 windows at a 5 s window
  silence_rms: 1.0e-4                # -80 dBFS; the quietest dataset clip is -51 dBFS

baseline:
  classifier: random_forest          # svm | random_forest; random_forest won on validation (R1)

cnn:
  time_pooling: mean                 # mean (CNN) | lstm (CRNN)
  epochs: 25                         # the weights of the best validation epoch are kept
  batch_size: 64
  lr: 1.0e-3                         # AdamW, with a cosine decay over the epochs
  weight_decay: 1.0e-4

evaluation:
  nine_class_subset:                 # background plus classes with >= 50 training vessels in every fold
    - background
    - cargo
    - fishing
    - other
    - passengership
    - pleasurecraft
    - sailing
    - tanker
    - tug
