[project]
name = "acousticwise"
version = "0.1.0"
description = "Vessel-type classification from passive underwater sound (UniqueShip)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
