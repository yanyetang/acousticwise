name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        # The coverage table also goes to the run's Summary page.
        run: uv run pytest --cov-fail-under=90 --cov-report=markdown-append:$GITHUB_STEP_SUMMARY
