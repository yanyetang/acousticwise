[project]
name = "acousticwise"
version = "0.1.0"
description = "Vessel-type classification from passive underwater sound (UniqueShip)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "soundfile>=0.14.0",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage on every run: a per-file table with missing lines, and LCOV for crapper.
# The 90% floor is in CI only, so a run of one test file doesn't fail on coverage.
addopts = """-ra --strict-markers \
--cov=acousticwise --cov-report=term-missing \
--cov-report=lcov:target/coverage/python/lcov.info"""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Known up front, so tests can import a module before its file exists (RED commits).
known-first-party = ["acousticwise"]
