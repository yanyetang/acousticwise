# Runs on every `git commit`. Set up once per clone: uv run pre-commit install
# The hooks use the project's own ruff (from uv.lock), so they match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^(notebooks|docs)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^(notebooks|docs)/
